<app-info-card
[showHeader]="true"
title="Proyectos"
>
    <div class="projects-card-wrapper">
        <app-project-card
        *ngFor="let project of projects"
        [title]="project.title"
        [description]="project.description"
        [githubUrl]="project.githubUrl"
        >
        </app-project-card>
    </div>
</app-info-card>
